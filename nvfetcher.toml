[sol]
src.github = "ospfranco/sol"
fetch.url = "https://github.com/ospfranco/sol/releases/download/$ver/$ver.zip"

[pdfcraft]
src.github = "storytold/pdfcraft"
src.prefix = "v"
fetch.url = "https://github.com/storytold/pdfcraft/releases/download/v$ver/pdfcraft-$ver-macos-universal.dmg"

[tinycast]
src.github = "abue-ammar/tinycast"
src.prefix = "v"
fetch.url = "https://github.com/abue-ammar/tinycast/releases/download/v$ver/Tinycast-$ver.dmg"

[ardia]
# Track nightlies via tags: nixpkgs nvfetcher is still 0.8.0 (no src.prerelease).
src.github_tag = "mantrakp04/ardia"
src.include_regex = "v?[0-9.]+-nightly\\.[0-9]+"
src.prefix = "v"
fetch.url = "https://github.com/mantrakp04/ardia/releases/download/v$ver/Ardia-$ver.dmg"